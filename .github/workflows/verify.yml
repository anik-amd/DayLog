name: Verify

# Fast feedback on every change: compiles the app and runs the JVM test suite.
#
# No emulator and no lint gate. Emulator tests are where the minutes and the flakes come from, and
# the parts that would fail there are already covered by JVM tests. Lint is a separate, opt-in
# check.
on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
      - main

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install the Android SDK
        run: |
          bash scripts/install-android-sdk.sh "$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Run tests and assemble
        run: ./gradlew test assembleDebug --stacktrace

      - name: Check the design has not changed
        run: ./gradlew validateDebugScreenshotTest --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload the screenshot report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-report
          path: '**/build/reports/screenshotTest/**'
          retention-days: 7
          if-no-files-found: ignore
