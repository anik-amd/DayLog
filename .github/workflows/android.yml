name: Build Android APK

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Android native project
        run: npx expo prebuild --platform android --clean

      - name: Create keystore from secrets
        run: |
          mkdir -p android/app
          echo "${{ secrets.SIGNING_KEY }}" | tr -d '\r\n' | base64 -d > android/app/upload.keystore

      - name: Configure signing for release build
        run: |
          cat >> android/app/build.gradle << 'EOF'
          
          android {
              signingConfigs {
                  release {
                      storeFile file('upload.keystore')
                      storePassword '${{ secrets.SIGNING_KEY_STORE_PASSWORD }}'
                      keyAlias 'upload'
                      keyPassword '${{ secrets.SIGNING_KEY_KEY_PASSWORD }}'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }
          EOF

      - name: Bundle JS for Android
        run: npx expo export --platform android --output-dir ./dist

      - name: Copy bundle to assets
        run: |
          mkdir -p android/app/src/main/assets
          cp -r dist/* android/app/src/main/assets/

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DayLog.apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: DayLog.apk

      - name: Configure git identity
        run: |
          git config user.name "DayLog CI"
          git config user.email "ci@daylog.app"

      - name: Create git tag
        run: |
          git tag -a v${{ github.run_number }} -m "Release v${{ github.run_number }}"
          git push origin v${{ github.run_number }}

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: "*.apk"
          body: |
            ## DayLog Android APK
            
            Standalone APK with bundled JS - works without Metro bundler.
            
            Built from commit: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
