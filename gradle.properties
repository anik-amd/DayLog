org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.nonFinalResIds=true

kotlin.code.style=official
ksp.incremental=true

# Compose Preview Screenshot Testing renders the previews on the JVM, so the UI can be checked
# without a device or an emulator. It is the only way the design is ever looked at in CI.
android.experimental.enableScreenshotTest=true
android.compose.screenshot.maxHeapSize=4g
